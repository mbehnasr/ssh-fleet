# =============================================================================
#  Environment: lab            -- EXAMPLE, copy into config.d/ and edit
#  Network:     192.0.2.0/24, every host reachable directly (no bastion)
#  Account:     inherited from "Host *" in ~/.ssh/config
#  Auth:        PASSWORD, by choice -- no key is deployed in this environment
#
#  !! RFC 5737 documentation addresses (192.0.2.0/24) -- REPLACE ALL.
#
#  Alias convention:  <environment>_<purpose>_<server>
#
#  Sources, most authoritative first -- record where an entry came from:
#     1. 'kubectl get nodes -o wide' on the live cluster decides which cluster
#        every Kubernetes NODE belongs to
#     2. 'ceph orch host ls' for the Ceph hosts
#     3. bookmarks / old session exports for everything else
#
#  FILE LAYOUT (order matters -- first match wins):
#     1. individual hosts   : only what is unique to that host
#     2. environment block  : Host lab_*  -- everything shared by the env
# =============================================================================


# -----------------------------------------------------------------------------
# k8s -- control plane, stacked etcd
# -----------------------------------------------------------------------------
Host lab_k8s_vip
    HostName 192.0.2.10          # REPLACE
    # keepalived VIP in front of the masters
    # answers with the name of whichever master holds it right now

Host lab_k8s_master01
    HostName 192.0.2.11          # REPLACE
    # hostname: lab-cp-01

Host lab_k8s_master02
    HostName 192.0.2.12          # REPLACE
    # hostname: lab-cp-02

Host lab_k8s_master03
    HostName 192.0.2.13          # REPLACE
    # hostname: lab-cp-03


# -----------------------------------------------------------------------------
# k8s -- workers
# -----------------------------------------------------------------------------
Host lab_k8s_worker01
    HostName 192.0.2.21          # REPLACE
    # hostname: lab-wk-01

Host lab_k8s_worker02
    HostName 192.0.2.22          # REPLACE
    # hostname: lab-wk-02

Host lab_k8s_worker03
    HostName 192.0.2.23          # REPLACE
    # hostname: lab-wk-03

Host lab_k8s_worker04
    HostName 192.0.2.24          # REPLACE
    # hostname: lab-wk-04
    # status: not a node of the live cluster -- drained, VM still running?


# -----------------------------------------------------------------------------
# ceph -- storage cluster
# -----------------------------------------------------------------------------
Host lab_ceph_admin01
    HostName 192.0.2.31          # REPLACE
    # hostname: lab-ceph-01
    # mon, mgr, _admin -- run 'ceph orch host ls' here

Host lab_ceph_osd01
    HostName 192.0.2.32          # REPLACE
    # hostname: lab-ceph-02
    # osd

Host lab_ceph_osd02
    HostName 192.0.2.33          # REPLACE
    # hostname: lab-ceph-03
    # osd


# -----------------------------------------------------------------------------
# ENVIRONMENT DEFAULTS -- apply to every lab_* alias above
# -----------------------------------------------------------------------------
Host lab_*
    # User inherited from "Host *". Uncomment to override env-wide:
    #User someone-else

    # This environment authenticates with a PASSWORD, by choice. Public-key
    # auth is turned OFF rather than simply leaving IdentityFile unset:
    # otherwise ssh still offers the default identities (~/.ssh/id_*) to every
    # host, which leaks which keys you hold and burns sshd's MaxAuthTries
    # (default 6) before it ever prompts you for the password -- the classic
    # "Too many authentication failures".
    PubkeyAuthentication no
    PreferredAuthentications keyboard-interactive,password
    IdentitiesOnly yes

    # Passwords are never stored here. Save one in the login keyring instead:
    #   ssh-pass set --env lab
    # See README section 7b.

    UserKnownHostsFile ~/.ssh/known_hosts.d/lab

    Tag lab


# -----------------------------------------------------------------------------
# NO BASTION CONFIGURED
#
# If lab is only reachable through a jump host, add it and one group block --
# nothing else in this file changes:
#
#   Host lab_bastion
#       HostName <bastion-ip>
#
#   Host lab_ceph_* lab_k8s_*
#       ProxyJump lab_bastion
#
# Put the group block ABOVE "Host lab_*" and below the individual hosts, and
# keep the bastion's own alias out of the pattern or it jumps through itself.
# -----------------------------------------------------------------------------
