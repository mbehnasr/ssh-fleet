# =============================================================================
#  Environment: production     -- EXAMPLE, strictest settings in the fleet
#  Access:      edge bastion -> inner bastion -> host  (defence in depth)
#  Account:     inherited from "Host *" in ~/.ssh/config
#  Key:         ~/.ssh/keys/production_ed25519   (passphrase MANDATORY)
#
#  !! RFC 5737 documentation addresses (203.0.113.0/24) -- REPLACE ALL.
#
#  Production deviates from the other environments on purpose:
#    - host keys are never accepted interactively (pre-seeded out of band)
#    - the key is dropped from the agent after 4h instead of living forever
#    - multiplexed masters expire quickly so a forgotten terminal is not a
#      standing authenticated channel into production
# =============================================================================


# -----------------------------------------------------------------------------
# Bastion chain
# -----------------------------------------------------------------------------
Host production_bastion
    HostName 203.0.113.10        # REPLACE
    #Port 2222
    ControlPersist 15m

Host production_inner_jump
    HostName 203.0.113.20        # REPLACE
    ProxyJump production_bastion
    ControlPersist 15m


# -----------------------------------------------------------------------------
# ceph
# -----------------------------------------------------------------------------
Host production_ceph_node1
    HostName 203.0.113.31        # REPLACE

Host production_ceph_node2
    HostName 203.0.113.32        # REPLACE

Host production_ceph_node3
    HostName 203.0.113.33        # REPLACE


# -----------------------------------------------------------------------------
# k8s
# -----------------------------------------------------------------------------
Host production_k8s_master1
    HostName 203.0.113.41        # REPLACE

Host production_k8s_worker1
    HostName 203.0.113.51        # REPLACE


# -----------------------------------------------------------------------------
# ROUTING -- every production host is two hops away
# -----------------------------------------------------------------------------
Host production_ceph_* production_k8s_* production_sre_*
    ProxyJump production_bastion,production_inner_jump


# -----------------------------------------------------------------------------
# ENVIRONMENT DEFAULTS
# -----------------------------------------------------------------------------
Host production_*
    IdentityFile ~/.ssh/keys/production_ed25519
    IdentitiesOnly yes
    UserKnownHostsFile ~/.ssh/known_hosts.d/production
    Tag production

    # No trust-on-first-use in production: an unknown host key is a hard
    # failure, not a prompt. Seed ~/.ssh/known_hosts.d/production from a
    # fingerprint you obtained out of band (console, config management, or an
    # SSH CA entry) -- see README, "Host key verification at scale".
    StrictHostKeyChecking yes

    # The production key is dropped from the agent after 4 hours, so an
    # unlocked laptop left overnight cannot be used to reach production in the
    # morning. Re-entering the passphrase once a day is the whole cost.
    AddKeysToAgent 4h

    # Shorter than the fleet default: forgotten terminals should not hold an
    # authenticated channel open into production.
    ControlPersist 5m

    # Belt and braces: never let a production host reach back into the agent.
    ForwardAgent no
