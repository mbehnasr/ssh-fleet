# =============================================================================
#  Environment: staging        -- EXAMPLE, copy into config.d/ and edit
#  Topology:    two network zones behind one edge bastion
#  Account:     inherited from "Host *" in ~/.ssh/config
#  Key:         ~/.ssh/keys/staging_ed25519
#
#  !! RFC 5737 documentation addresses (198.51.100.0/24) -- REPLACE ALL.
#
#      workstation
#           |
#      staging_bastion            (edge, reachable from the office network)
#           |
#           +-- mgmt zone         reachable straight from the bastion
#           |     k8s control plane, lb, ceph, gitlab
#           |
#           +-- workload zone     only reachable from the mgmt jump host
#                 k8s workers
#
#  Alias convention:  <environment>_<purpose>_<server>
#
#  Per-host metadata lives in structured comments. ssh ignores them;
#  ssh-menu and ssh-find index and search them:
#     # hostname: <real node name>
#     # status:   <why this entry is suspect>
#     # <anything else>   free-text note, also searchable
#
#  FILE LAYOUT (order matters -- first match wins):
#     1. individual hosts   : only what is unique to that host
#     2. zone routing       : ProxyJump per network zone
#     3. environment block  : Host staging_*  -- everything shared by the env
# =============================================================================


# -----------------------------------------------------------------------------
# Zone entry points
# -----------------------------------------------------------------------------
Host staging_bastion
    HostName 198.51.100.10       # REPLACE
    ControlPersist 30m

Host staging_mgmt_jump
    HostName 198.51.100.20       # REPLACE
    ProxyJump staging_bastion
    ControlPersist 30m


# -----------------------------------------------------------------------------
# k8s -- control plane (mgmt zone: one hop)
# -----------------------------------------------------------------------------
Host staging_k8s_lb1
    HostName 198.51.100.30       # REPLACE
    # hostname: stg-k8s-lb-01
    # haproxy in front of the API servers

Host staging_k8s_master1
    HostName 198.51.100.31       # REPLACE
    # hostname: stg-k8s-cp-01

Host staging_k8s_master2
    HostName 198.51.100.32       # REPLACE
    # hostname: stg-k8s-cp-02

Host staging_k8s_master3
    HostName 198.51.100.33       # REPLACE
    # hostname: stg-k8s-cp-03


# -----------------------------------------------------------------------------
# k8s -- workers (workload zone: two hops)
# -----------------------------------------------------------------------------
Host staging_k8s_worker1
    HostName 198.51.100.41       # REPLACE
    # hostname: stg-k8s-wk-01

Host staging_k8s_worker2
    HostName 198.51.100.42       # REPLACE
    # hostname: stg-k8s-wk-02

Host staging_k8s_worker3
    HostName 198.51.100.43       # REPLACE
    # hostname: stg-k8s-wk-03
    # status: not a node of the live cluster (kubectl get nodes, 2026-10-01)


# -----------------------------------------------------------------------------
# ceph -- storage cluster (mgmt zone)
# -----------------------------------------------------------------------------
Host staging_ceph_node1
    HostName 198.51.100.51       # REPLACE
    # hostname: stg-ceph-01
    # mon, mgr, osd, _admin

Host staging_ceph_node2
    HostName 198.51.100.52       # REPLACE
    # hostname: stg-ceph-02
    # mon, osd

Host staging_ceph_node3
    HostName 198.51.100.53       # REPLACE
    # hostname: stg-ceph-03
    # mon, osd


# -----------------------------------------------------------------------------
# sre -- tooling
#
# One machine, two aliases: a shell login, and the git@ service account. The
# git alias overrides User with ONE line because its block is read first --
# the whole point of the most-specific-first layout.
# -----------------------------------------------------------------------------
Host staging_sre_gitlab
    HostName 198.51.100.60       # REPLACE
    # hostname: stg-gitlab-01

Host staging_sre_gitlab_git
    HostName 198.51.100.60       # REPLACE
    User git
    # Git needs no tty, and never an agent on the far side.
    RequestTTY no


# -----------------------------------------------------------------------------
# ZONE ROUTING -- the only place network topology is expressed
#
# Deeper zone first: ProxyJump takes a comma-separated chain and dials it left
# to right, so the worker pattern must be matched before the broader mgmt one.
# Moving a host between zones = moving its alias between these two patterns.
# The bastion and jump host are deliberately NOT matched here, or they would
# try to jump through themselves.
# -----------------------------------------------------------------------------
Host staging_k8s_worker*
    ProxyJump staging_bastion,staging_mgmt_jump

Host staging_k8s_* staging_ceph_* staging_sre_*
    ProxyJump staging_bastion


# -----------------------------------------------------------------------------
# ENVIRONMENT DEFAULTS -- read last in this file, so host blocks win over it
# -----------------------------------------------------------------------------
Host staging_*
    # User inherited from "Host *". Uncomment to override env-wide:
    #User someone-else

    IdentityFile ~/.ssh/keys/staging_ed25519
    IdentitiesOnly yes

    # Per-environment host key database: isolated environments reuse RFC 1918
    # space, so a shared known_hosts would turn legitimate IP reuse into a
    # permanent host-key warning.
    UserKnownHostsFile ~/.ssh/known_hosts.d/staging

    Tag staging


# -----------------------------------------------------------------------------
# LEGACY APPLIANCE EXAMPLE -- narrow the exception, never the whole fleet
#
# OpenSSH 10 removed DSA entirely and has rejected RSA/SHA-1 host keys since
# 8.8. An old switch, iDRAC/iLO, or RHEL 6-era box may need this. Scope it to
# the one host that needs it; putting it in "Host *" silently downgrades the
# crypto of every server you own. Place it ABOVE the routing and defaults.
#
#   Host staging_net_switch1
#       HostName 198.51.100.250
#       HostKeyAlgorithms +ssh-rsa
#       PubkeyAcceptedAlgorithms +ssh-rsa
#       KexAlgorithms +diffie-hellman-group14-sha1
#       # Check what the peer actually offers first:
#       #   ssh -vvv staging_net_switch1 2>&1 | grep -i 'peer server KEXINIT'
# -----------------------------------------------------------------------------
