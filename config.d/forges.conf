# =============================================================================
#  Code forges reached over SSH -- not an infrastructure environment.
#
#  WHY THIS FILE EXISTS
#  "Host *" in ~/.ssh/config sets your fleet account ("User") for everything,
#  which is right for the fleet and wrong for a git forge. A remote written as
#  git@github.com:owner/repo.git overrides it on the command line, so it
#  happens to work -- but "ssh github.com", an ssh://github.com/... URL, or a
#  tool that builds its own remote would try to log in as your fleet account
#  and fail with a confusing permission error. An explicit block removes that
#  trap and pins exactly which key is offered.
#
#  KEY CHOICE
#  Deliberately the PERSONAL key (~/.ssh/id_ed25519), never an infrastructure
#  key: different threat model, different rotation schedule, and an
#  infrastructure key should never be registered with an external service.
# =============================================================================

Host github.com
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    # Git needs no tty, and never an agent on the far side.
    RequestTTY no
    ForwardAgent no

# A self-hosted forge inside an environment follows the same pattern, e.g.
# staging_sre_gitlab_git in examples/config.d/staging.conf.
